[project]
name = "desk"
version = "0.1.0"
description = "Autonomous AI trading desk: a head-trader agent and a team of specialist agents on an event bus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-ulid>=2.7",
    "redis>=5.0",
    "psycopg[binary,pool]>=3.2",
    "anthropic>=1.0",
    "python-dotenv>=1.0",
    "alpaca-py>=0.44.0",
    "exchange-calendars>=4.13.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "pyarrow>=26.0.1",
]

[project.scripts]
desk = "desk.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv.workspace]
members = ["services/api"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py312"
